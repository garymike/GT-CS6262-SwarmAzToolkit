name: Security

on:
  # Scan pushes to main and every PR. Feature-branch pushes are covered by their
  # PR, so scanning every branch push too (branches: ["**"]) just double-billed.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Cancel superseded runs on the same ref (rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      packages: read       # reusable pulls the pinned betterleaks image from GHCR
      pull-requests: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@742792534109fc4f206f84cc09e67e8d2d4e0ca3 # main @ 2026-08-11
    secrets: inherit

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@742792534109fc4f206f84cc09e67e8d2d4e0ca3 # main @ 2026-08-11
    secrets: inherit
