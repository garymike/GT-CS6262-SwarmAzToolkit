name: Security

on:
  # Scan pushes to main and every PR. Feature-branch pushes are covered by their
  # PR, so scanning every branch push too (branches: ["**"]) just double-billed.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Cancel superseded runs on the same ref (rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default every job to read-only; a job that needs more raises it explicitly below.
permissions:
  contents: read

# Every job below calls a reusable workflow in garymike/security-workflows, pinned
# to a commit SHA. The caller's permissions block is a hard ceiling: a reusable
# workflow that asks for a permission the caller withheld fails at startup with
# no logs, so each job grants exactly what its callee declares. Do not add
# `secrets: inherit`; none of the callees need a secret.

jobs:
  scan:
    permissions:
      contents: read
      packages: read       # reusable pulls the pinned betterleaks image from GHCR
      pull-requests: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  gha-security:
    # zizmor + actionlint over .github/workflows: injection, excessive permissions,
    # unpinned actions. Applies to every repo that has a workflow, i.e. this one.
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  iac-security:
    # Checkov over Dockerfiles, compose, Bicep, Terraform, pipelines. Drop this job
    # if the repo carries no infrastructure-as-code.
    permissions:
      contents: read
      packages: read
      security-events: write   # the callee declares this even when SARIF upload is off
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-10-01
